<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャラクター属性ガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf9f4;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --card:#ffffff;
    --shadow:rgba(43,43,43,0.08);
    --zone-bg:#f2efe6;
    --zone-border:#d8d2c2;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
  }

  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  header{
    text-align:center;
    margin-bottom:24px;
  }
  h1{
    font-size:clamp(24px, 4.5vw, 34px);
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  h1 .dice{ display:inline-block; margin-right:6px; }
  .sub{
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0;
  }

  /* ---------- section titles ---------- */
  .section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:28px 0 10px;
    flex-wrap:wrap;
    gap:8px;
  }
  .section-title h2{
    font-size:15px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .section-title .desc{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .mini-btns{
    display:flex;
    gap:8px;
  }
  .mini-btn{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    background:#fff;
    border:1px solid var(--zone-border);
    border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .mini-btn:hover{ background:#eee; color:var(--ink); }

  /* ---------- drop zones ---------- */
  .zone{
    background:var(--zone-bg);
    border:2px dashed var(--zone-border);
    border-radius:20px;
    padding:16px;
    min-height:74px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:flex-start;
    transition:background .15s ease, border-color .15s ease;
  }
  .zone.drag-over{
    background:#eae4d2;
    border-color:#b8ac8a;
  }
  .zone .placeholder{
    font-size:13px;
    color:var(--ink-soft);
    opacity:0.65;
    font-weight:500;
    align-self:center;
    margin:0 auto;
    padding:14px 0;
  }

  /* ---------- attribute cards ---------- */
  .card{
    background:var(--card);
    border-radius:14px;
    padding:9px 16px;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    box-shadow:0 2px 0 var(--shadow), 0 3px 8px rgba(0,0,0,0.05);
    border-top:5px solid var(--chip-color, #4D96FF);
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    transition:transform .12s ease, opacity .12s ease;
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{ opacity:0.4; }
  .card:hover{ transform:translateY(-2px); }

  /* ---------- gacha button ---------- */
  .btn-row{
    display:flex;
    justify-content:center;
    margin:26px 0 6px;
  }
  .summon-btn{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:18px;
    font-weight:700;
    color:#fff;
    background:#FF7A5C;
    border:none;
    border-radius:999px;
    padding:14px 40px;
    cursor:pointer;
    box-shadow:0 4px 0 #d85c40, 0 6px 14px rgba(0,0,0,0.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .summon-btn:hover{ transform:translateY(-2px); }
  .summon-btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #d85c40, 0 3px 8px rgba(0,0,0,0.12);
  }
  .summon-btn:disabled{
    opacity:0.55;
    cursor:default;
    transform:none;
    box-shadow:0 4px 0 #d85c40, 0 6px 14px rgba(0,0,0,0.12);
  }

  .count-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
    min-height:16px;
  }

  /* ---------- result chips ---------- */
  .chips{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .chip{
    background:var(--card);
    border-radius:18px;
    padding:12px 18px;
    min-width:128px;
    box-shadow:0 3px 0 var(--shadow), 0 4px 10px rgba(0,0,0,0.05);
    border-top:6px solid var(--chip-color, #4D96FF);
    text-align:center;
  }
  .chip .tag{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin-bottom:4px;
  }
  .chip .value{
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    min-height:1.3em;
    letter-spacing:0.01em;
  }
  .chip .value.spinning{ color:var(--chip-color, #4D96FF); }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
  }

  @media (max-width:480px){
    .card{ padding:8px 12px; font-size:13px; }
    .chip{ min-width:104px; padding:10px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="dice">🎲</span>キャラクター属性ガチャ</h1>
    <p class="sub">使いたい属性カードをスロットにセットしよう。スロット台風にしたかったけど技術力不足。</p>
  </header>

  <div class="section-title">
    <h2>① スロット（ここに入れた属性だけ回る）</h2>
    <div class="mini-btns">
      <button class="mini-btn" id="useAllBtn">全部使う</button>
      <button class="mini-btn" id="resetBtn">全部戻す</button>
    </div>
  </div>
  <div class="zone" id="slotZone"></div>

  <div class="btn-row">
    <button class="summon-btn" id="summonBtn">ガチャを回す</button>
  </div>
  <div class="count-hint" id="countHint"></div>

  <div class="chips" id="chipsContainer"></div>

  <div class="section-title">
    <h2>② 属性カードの置き場</h2>
    <div class="desc">カードをドラッグ・タップでスロットと行き来できちゃう</div>
  </div>
  <div class="zone" id="storageZone"></div>

  <footer>種族・立場・使用武器・性格・趣味嗜好・モチーフ・メインカラー・サブカラー・髪型・特徴</footer>
</div>

<script>
/* ============ 属性データ ============ */
const POOLS = {
  race: ["人間","無能力者","異能者","魔族","悪魔","天使","神","半神","妖精","精霊","幽霊","吸血鬼","狼男","魔女","ドラゴン","リザードマン","エルフ","ダークエルフ","ドワーフ","オーク","スライム","人魚","セイレーン","ハーピー","ケンタウロス","ラミア","アラクネ","鬼","妖怪","怪異","神獣","機械生命体","AI","サイボーグ","アンドロイド","ホムンクルス","キメラ","人造生命体","寄生生物","ドライアド","蟲人","宇宙生命体","邪神","堕天使","ゾンビ","アンデッド","骸骨"],

  status: ["ニート","学生","新人","ベテラン","輪廻者","異世界人","王族","貴族","一般市民","孤児","王","奴隷","傭兵","流浪人","神父","シスター","教師","医師","看護師","探偵","刑事","囚人"],

  weapon: ["西洋剣","刀","大剣","双剣","槍","薙刀","弓","スナイパーライフル","拳","暗殺器","忍術","魔法","召喚能力","呪術","錬金術","聖剣","肉体","死霊","人形","ロボット","拳銃","ガトリング","ロケラン","罠","爆弾"],

  personality: ["熱血","冷静","天然","ドジ","真面目","クール","腹黒","お人良し","ダウナー","アッパー","狂人","ヤンデレ","ツンデレ","デレデレ","無口","おしゃべり","ポジティブ","ネガティブ","臆病","勇敢","優しい","残忍","傲慢","強欲","怠惰","色欲","嫉妬深い","強迫観念持ち","博愛主義","自己犠牲型"],

  hobby: ["読書","紅茶","コーヒー","スイーツ","激辛","酒","猫","犬","昆虫","標本集め","骨董品収集","機械いじり","裁縫","ピアノ","バイオリン","ダンス","絵画","写真","料理","園芸","睡眠","散歩"],

  motif: ["狼","狐","猫","犬","蛇","鷹","梟","烏","蝶","蜘蛛","蠍","蜂","鮫","鯨","蛸","鹿","桜","薔薇","百合","椿","藤","彼岸花","蓮","松","竹","梅","太陽","月","星","彗星","ブラックホール","惑星","銀河","時計","歯車","本","鍵","鎖","人形","仮面","鏡","傘","棺","剣","銃","トランプ","チェス","オルゴール"],

  main_color: ["白","グレー","ベージュ","黒","赤","深紅","橙色","ピンク","琥珀色","黄","黄金","緑","深緑","黄緑","翡翠","ライム","ミント","水色","シアン","ティール","青","紺","藍色","ネイビー","コバルトブルー","ミッドナイトブルー","アイスブルー","紫","藤色","ラベンダー","ライラック","アメジスト","茶","栗色","胡桃色","セピア","銀鼠","鼠色","金","銀","銅","青銅色","白金","虹色","オーロラ","プリズム","朝焼け色","夕焼け色","黄昏色","夜明け色"],

  sub_color: ["白","グレー","ベージュ","黒","赤","深紅","橙色","ピンク","琥珀色","黄","黄金","緑","深緑","黄緑","翡翠","ライム","ミント","水色","シアン","ティール","青","紺","藍色","ネイビー","コバルトブルー","ミッドナイトブルー","アイスブルー","紫","藤色","ラベンダー","ライラック","アメジスト","茶","栗色","胡桃色","セピア","銀鼠","鼠色","金","銀","銅","青銅色","白金","虹色","オーロラ","プリズム","朝焼け色","夕焼け色","黄昏色","夜明け色"],

  clothing: ["制服","軍服","スーツ","タキシード","ドレス","ゴスロリ","ロリータ","パンク","和服","巫女服","着物","浴衣","忍装束","修道服","神父服","白衣","メイド服","執事服","チャイナ服","アイドル衣装","パーカー","コート","マント","ケープ","鎧","軽装","重装","ボディスーツ","水着","学ラン","セーラー服"],

  accessory: ["帽子","王冠","ティアラ","花冠","ヘッドドレス","カチューシャ","リボン","ゴーグル","ヘッドホン","狐面","ガスマスク","フード","ベール","アイパッチ","ピアス","イヤーカフ","ネックレス","チョーカー","指輪","ブレスレット","アンクレット","数珠","懐中時計","ロケットペンダント","勲章","ブローチ","ベルト多数","鎖","眼鏡","丸眼鏡","スクエア","モノクル","サングラス","ゴーグル"],

  hairstyle: ["ベリーショート","ショート","ショートボブ","ボブ","マッシュ","マッシュショート","ウルフカット","ショートウルフ","ベリーウルフ","レイヤーショート","ベリーショートオールバック","セミロング","ミディアム","ミディアムウルフ","レイヤーカット","外ハネ","内巻き","ロブ","センターパート","七三分け","ワンレン","ロング","スーパーロング","ロングウェーブ","ストレートロング","カールロング","姫カット","前髪ぱっつん","前髪なし","シースルーバング","ポニーテール","ハイポニー","ローポニー","サイドポニー","ツインテール","ハーフツイン","ハーフアップ","お団子","シニヨン","三つ編み","編み込み","フィッシュボーン","ドリル","一本結び","後ろ結び"],

  hairstyle_male: ["オールバック","オールバックポニー","リーゼント","スリックバック","アップバング","ダウンバング","ツーブロック","フェードカット","ソフトモヒカン","モヒカン","クロップ","スパイキーショート","無造作ヘア","束感ショート","ネオウルフ","コンマヘア","韓国風センターパート","ロングセンターパート","ウェーブマッシュ","パーマヘア","スパイラルパーマ","ツイストパーマ","アフロ","ドレッドヘア","コーンロウ","マンバン","サムライヘア","長髪オールバック"],

  hairstyle_special: ["アホ毛","寝癖","片メカクレ","両メカクレ","触手髪","炎髪","水髪","蔦髪","結晶髪","羽毛髪","蛇髪","エネルギーの髪","浮遊する髪","機械髪"],

  feature: ["小柄","華奢","標準","高身長","筋肉質","細マッチョ","巨漢","グラマラス","幼児体型","モデル体型","獣耳","尻尾","翼","角","隻眼","義眼","義手","義足","義体","単眼","複眼","多腕","多脚","四枚翼","六枚翼","発光する瞳","発光する紋様","タトゥー","刺青","火傷跡","傷跡","包帯","仮面","人形の関節","機械化","植物化","結晶化","常に眠そう","記憶喪失","多重人格","呪われている","左利き","方向音痴","人外化","感情がない","声を失っている"]
};

/* カテゴリ定義（順序・ラベル・色） */
const SLOTS = [
  { key:"race",        label:"種族",         pool:"race",        color:"#4D96FF" },
  { key:"status",      label:"立場",         pool:"status",      color:"#FFD93D" },
  { key:"weapon",      label:"使用武器",     pool:"weapon",      color:"#FF7A5C" },
  { key:"personality", label:"性格",         pool:"personality", color:"#FF6B6B" },
  { key:"hobby",       label:"趣味・嗜好",   pool:"hobby",       color:"#00C2A8" },
  { key:"motif",       label:"モチーフ",     pool:"motif",       color:"#FFA45C" },
  { key:"main_color",  label:"メインカラー", pool:"main_color",  color:"#B983FF" },
  { key:"sub_color",   label:"サブカラー",   pool:"sub_color",   color:"#C77DFF" },
  { key:"clothing",    label:"服装",         pool:"clothing",    color:"#4DD0E1" },
  { key:"accessory",   label:"アクセサリー",  pool:"accessory",   color:"#F4A6C6" },
  { key:"hairstyle",         label:"髪型",         pool:"hairstyle",         color:"#FF8FAB" },
  { key:"hairstyle_male",    label:"髪型(男性系)", pool:"hairstyle_male",    color:"#7C93A8" },
  { key:"hairstyle_special", label:"髪型(特殊)",   pool:"hairstyle_special", color:"#A66DD4" },
  { key:"feature",     label:"特徴",         pool:"feature",     color:"#6BCB77" },
];

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const slotZone = document.getElementById('slotZone');
const storageZone = document.getElementById('storageZone');
let spinTimers = [];
let drawCount = 0;

/* ---------- カード生成 ---------- */
function createCard(slot){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+slot.key;
  card.dataset.key = slot.key;
  card.draggable = true;
  card.style.setProperty('--chip-color', slot.color);
  card.textContent = slot.label;

  card.addEventListener('dragstart', (e)=>{
    e.dataTransfer.setData('text/plain', slot.key);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', ()=>{
    card.classList.remove('dragging');
  });
  card.addEventListener('click', ()=>{
    const targetZone = card.parentElement === slotZone ? storageZone : slotZone;
    targetZone.appendChild(card);
    refreshPlaceholders();
  });

  return card;
}

function refreshPlaceholders(){
  [slotZone, storageZone].forEach(zone=>{
    const hasCards = zone.querySelectorAll('.card').length > 0;
    let placeholder = zone.querySelector('.placeholder');
    if(!hasCards){
      if(!placeholder){
        placeholder = document.createElement('div');
        placeholder.className = 'placeholder';
        placeholder.textContent = zone === slotZone
          ? 'ここに属性カードをドラッグ（またはタップ）してください'
          : '（すべてのカードがスロットに入っています）';
        zone.appendChild(placeholder);
      }
    } else if(placeholder){
      placeholder.remove();
    }
  });
}

function setupZoneDropTarget(zone){
  zone.addEventListener('dragover', (e)=>{
    e.preventDefault();
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', ()=>{
    zone.classList.remove('drag-over');
  });
  zone.addEventListener('drop', (e)=>{
    e.preventDefault();
    zone.classList.remove('drag-over');
    const key = e.dataTransfer.getData('text/plain');
    const card = document.getElementById('card-'+key);
    if(card){
      zone.appendChild(card);
      refreshPlaceholders();
    }
  });
}

/* ---------- 初期化：全カードをスロットに配置 ---------- */
SLOTS.forEach(slot=>{
  slotZone.appendChild(createCard(slot));
});
setupZoneDropTarget(slotZone);
setupZoneDropTarget(storageZone);
refreshPlaceholders();

document.getElementById('useAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.card').forEach(card=> slotZone.appendChild(card));
  refreshPlaceholders();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.card').forEach(card=> storageZone.appendChild(card));
  refreshPlaceholders();
});

/* ---------- ガチャ処理 ---------- */
function buildChips(activeSlots){
  const chips = document.createElement('div');
  chips.className = 'chips';
  activeSlots.forEach(slot=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.setProperty('--chip-color', slot.color);
    chip.innerHTML = `<div class="tag">${slot.label}</div><div class="value spinning" id="val-${slot.key}">&nbsp;</div>`;
    chips.appendChild(chip);
  });
  return chips;
}

function summon(){
  const btn = document.getElementById('summonBtn');
  const container = document.getElementById('chipsContainer');
  const hint = document.getElementById('countHint');

  const activeKeys = Array.from(slotZone.querySelectorAll('.card')).map(c=>c.dataset.key);
  const activeSlots = SLOTS.filter(s=> activeKeys.includes(s.key));

  if(activeSlots.length === 0){
    hint.textContent = 'スロットに属性カードを入れてから回してください';
    container.innerHTML = '';
    return;
  }

  btn.disabled = true;
  spinTimers.forEach(t=>clearInterval(t));
  spinTimers = [];
  drawCount++;

  container.innerHTML = '';
  container.appendChild(buildChips(activeSlots));
  hint.textContent = `第${drawCount}回目の結果`;

  const results = {};
  activeSlots.forEach(slot=>{
    results[slot.key] = pickRandom(POOLS[slot.pool]);
  });

  activeSlots.forEach((slot, i)=>{
    const valEl = document.getElementById('val-'+slot.key);
    const pool = POOLS[slot.pool];

    const timer = setInterval(()=>{
      valEl.textContent = pickRandom(pool);
    }, 45);
    spinTimers.push(timer);

    const stopDelay = 260 + i * 55;
    setTimeout(()=>{
      clearInterval(timer);
      valEl.textContent = results[slot.key];
      valEl.classList.remove('spinning');
    }, stopDelay);
  });

  const totalTime = 260 + (activeSlots.length-1)*55 + 120;
  setTimeout(()=>{ btn.disabled = false; }, totalTime);
}

document.getElementById('summonBtn').addEventListener('click', summon);
</script>
</body>
</html>
